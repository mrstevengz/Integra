<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Expediente medico</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #F2F4F7;
            color: #191F29;
            line-height: 1.5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
        }

        .hoja {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 64px
        }

        header {
            border-bottom: 2px solid #1C469C;
            padding-bottom: 12px;
            margin-bottom: 20px
        }

        .marca {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #1C469C
        }

        .bajada {
            font-size: 12px;
            color: #717B8E
        }

        h1 {
            font-size: 26px;
            margin: 16px 0 4px
        }

        h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #717B8E;
            margin: 0 0 8px;
            border-bottom: 1px solid #E3E6ED;
            padding-bottom: 6px
        }

        section {
            background: #FFF;
            border: 1px solid #E3E6ED;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px
        }

        .rejilla {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 24px;
            font-size: 14px;
            color: #575F70
        }

        .rejilla b {
            color: #191F29
        }

        .fila {
            padding: 10px 0;
            border-bottom: 1px solid #E3E6ED
        }

        .fila:last-child {
            border-bottom: none
        }

        .cabeza {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap
        }

        .titulo {
            font-weight: 600
        }

        .nota {
            margin: 2px 0 0;
            font-size: 13px;
            color: #575F70
        }

        .chip {
            margin-left: auto;
            font-size: 12px;
            padding: 2px 8px;
            white-space: nowrap;
            border: 1px solid #CFD4DD;
            border-radius: 6px;
            color: #575F70
        }

        .alergia .chip {
            border-color: #B81E1E;
            color: #B81E1E;
            font-weight: 700
        }

        .contacto .chip {
            font-size: 16px;
            font-weight: 700;
            border: none;
            color: #191F29
        }

        .tabla {
            width: 100%;
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #717B8E;
            border-bottom: 1px solid #CFD4DD;
            padding: 6px 8px 6px 0
        }

        td {
            padding: 6px 8px 6px 0;
            border-bottom: 1px solid #E3E6ED
        }

        .vacio {
            color: #9BA2B0;
            font-style: italic;
            font-size: 14px
        }

        .aviso {
            background: #FEF8EB;
            border-left: 4px solid #F59F0A;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #9B5E08;
            margin-bottom: 16px
        }

        footer {
            font-size: 12px;
            color: #717B8E;
            margin-top: 24px
        }

        .centrado {
            text-align: center;
            padding: 64px 16px
        }

        .centrado h1 {
            font-size: 22px
        }

        .centrado p {
            color: #575F70
        }
    </style>
</head>

<body>
    <div id="app" class="hoja centrado">
        <div class="marca">INTEGRA</div>
        <p>Cargando expediente...</p>
    </div>

    <script>
        const FUNCION = 'https://jwaccckrrkxywevelqab.supabase.co/functions/v1/expediente'

        const esc = (s) => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')

        function fecha(iso, conHora) {
            const d = new Date(iso)
            const dia = d.toLocaleDateString('es-CR', { day: 'numeric', month: 'short', year: 'numeric' })
            if (!conHora) return dia
            return dia + ' ' + d.toLocaleTimeString('es-CR', { hour: 'numeric', minute: '2-digit' })
        }

        function edad(nacimiento) {
            if (!nacimiento) return null
            const [a, m, d] = nacimiento.slice(0, 10).split('-').map(Number)
            if (!a || !m || !d) return null
            const hoy = new Date()
            let anios = hoy.getFullYear() - a
            const meses = hoy.getMonth() + 1 - m
            if (meses < 0 || (meses === 0 && hoy.getDate() < d)) anios--
            return anios >= 0 ? anios : null
        }

        function fila(f, clase) {
            const notas = (f.notas || []).filter(Boolean)
            return '<div class="fila ' + (clase || '') + '">' +
                '<div class="cabeza"><span class="titulo">' + esc(f.titulo) + '</span>' +
                (f.chip ? '<span class="chip">' + esc(f.chip) + '</span>' : '') + '</div>' +
                notas.map((n) => '<p class="nota">' + esc(n) + '</p>').join('') +
                '</div>'
        }

        const seccion = (titulo, contenido) =>
            '<section><h2>' + esc(titulo) + '</h2>' +
            (contenido || '<p class="vacio">Sin registros</p>') + '</section>'

        function mostrarError(mensaje) {
            document.getElementById('app').innerHTML =
                '<div class="marca">INTEGRA</div>' +
                '<h1>Expediente no disponible</h1>' +
                '<p>' + esc(mensaje) + '</p>' +
                '<p>Pedile a la persona un enlace nuevo.</p>'
        }

        function dibujar(d) {
            const p = d.perfil
            const incluye = d.secciones
            const anios = edad(p.fecha_nacimiento)
            const nombre = ((p.nombre || '') + ' ' + (p.apellidos || '')).trim()

            const activos = d.medicamentos.filter((m) => m.activo)
            const inactivos = d.medicamentos.filter((m) => !m.activo)
            const pauta = (m) => (m.horarios || []).map((h) => (h.hora || '').slice(0, 5)).filter(Boolean).join(' · ')
            const medicamento = (m) => fila({
                titulo: m.nombre + ' ' + m.dosis + m.unidad,
                chip: m.forma,
                notas: [pauta(m), m.indicaciones],
            })

            const tipoPorId = {}
            d.tipos.forEach((t) => { tipoPorId[t.id] = t })

            const cuerpo = [
                incluye.datosPersonales && seccion('Datos personales',
                    '<div class="rejilla">' +
                    (anios != null ? '<span><b>' + anios + '</b> años</span>' : '') +
                    (p.fecha_nacimiento ? '<span>Nacimiento: <b>' + esc(fecha(p.fecha_nacimiento)) + '</b></span>' : '') +
                    (p.cedula ? '<span>Cedula: <b>' + esc(p.cedula) + '</b></span>' : '') +
                    (p.genero ? '<span>Genero: <b>' + esc(p.genero) + '</b></span>' : '') +
                    (p.tipo_sangre ? '<span>Sangre: <b>' + esc(p.tipo_sangre) + '</b></span>' : '') +
                    (p.telefono ? '<span>Telefono: <b>' + esc(p.telefono) + '</b></span>' : '') +
                    (p.medico_tratante ? '<span>Medico tratante: <b>' + esc(p.medico_tratante) + '</b></span>' : '') +
                    '</div>'),

                incluye.condicionesYAlergias && seccion('Alergias',
                    d.alergias.map((a) => fila({ titulo: a.nombre, chip: a.severidad, notas: [a.detalles] }, 'alergia')).join('')),

                incluye.condicionesYAlergias && seccion('Condiciones medicas',
                    d.condiciones.map((c) => fila({ titulo: c.nombre, chip: c.tipo, notas: [c.detalles] })).join('')),

                incluye.medicacionActiva && seccion('Medicacion activa', activos.map(medicamento).join('')),

                incluye.historialMedicacion && seccion('Historial de medicacion', inactivos.map(medicamento).join('')),

                incluye.mediciones && seccion('Mediciones de salud',
                    d.mediciones.length === 0 ? '' :
                        '<div class="tabla"><table><tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th>Contexto</th></tr>' +
                        d.mediciones.map((m) => {
                            const t = tipoPorId[m.tipo_medicion_id]
                            const valor = m.valor_secundario != null ? m.valor + '/' + m.valor_secundario : m.valor
                            return '<tr><td>' + esc(fecha(m.medido_en, true)) + '</td>' +
                                '<td>' + esc(t ? t.nombre : '') + '</td>' +
                                '<td>' + esc(valor) + ' ' + esc(t ? t.unidad : '') + '</td>' +
                                '<td>' + esc(m.contexto || '') + '</td></tr>'
                        }).join('') + '</table></div>'),

                incluye.citas && seccion('Citas medicas',
                    d.citas.map((c) => {
                        const r = d.resultados.find((x) => x.cita_id === c.id)
                        return fila({
                            titulo: c.especialidad + ' — ' + (c.medico || 'Sin medico'),
                            chip: r ? r.tipo_resultado : 'Pendiente',
                            notas: [
                                fecha(c.programada_para, true) + ' · ' + c.institucion,
                                r && r.diagnostico, r && r.instruccion, r && r.nota_cancelacion,
                            ],
                        })
                    }).join('')),

                incluye.contactosEmergencia && seccion('Contactos de emergencia',
                    d.contactos.map((c) => fila({ titulo: c.nombre, chip: c.telefono, notas: [c.relacion] }, 'contacto')).join('')),
            ].filter(Boolean).join('')

            document.title = 'Expediente de ' + nombre
            const app = document.getElementById('app')
            app.className = 'hoja'
            app.innerHTML =
                '<header><div class="marca">INTEGRA</div>' +
                '<div class="bajada">Expediente medico compartido</div></header>' +
                '<div class="aviso">Acceso temporal. Vence el ' + esc(fecha(d.expira_en, true)) +
                '. La persona puede revocarlo en cualquier momento.</div>' +
                '<h1>' + esc(nombre) + '</h1>' + cuerpo +
                '<footer>' + esc(d.codigo) + ' · La informacion proviene del expediente cargado ' +
                'por la persona usuaria y puede no estar completa ni actualizada. ' +
                'Ante una emergencia, priorice el criterio clinico.</footer>'
        }

        async function cargar() {
            const token = location.hash.slice(1)
            if (!token) return mostrarError('Enlace incompleto')

            try {
                const res = await fetch(FUNCION + '/' + encodeURIComponent(token))
                const datos = await res.json()
                if (!res.ok) return mostrarError(datos.error || 'No se pudo abrir el expediente')
                dibujar(datos)
            } catch {
                mostrarError('No hay conexion a internet')
            }
        }

        cargar()
    </script>
</body>

</html>
